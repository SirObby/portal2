[project]
name = "portal2-gym"
version = "0.1.0"
description = "Gymnasium environment for Portal 2, backed by a custom Source engine plugin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samuel Hautamäki" }]
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portal2_gym"]
